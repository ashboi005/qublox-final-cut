services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qublox
      POSTGRES_PASSWORD: qublox
      POSTGRES_DB: qublox
    ports:
      - "5433:5432"   # 5433 so it never fights a Postgres already on your machine
    volumes:
      - qublox-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qublox"]
      interval: 3s
      retries: 20
volumes:
  qublox-db:
